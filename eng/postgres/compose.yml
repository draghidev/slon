services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres123
    ports:
      - "${SLON_TEST_PORT:-55432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-auth-roles.sql:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
